<script>
(function(){
const NS='http://www.w3.org/2000/svg';
const $=id=>document.getElementById(id);
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3);
const eo4=x=>1-Math.pow(1-x,4);
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const ei=x=>x*x*x;
const lerp=(a,b,x)=>a+(b-a)*x;
function el(tag,attrs,parent,txt){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(txt!==undefined)e.textContent=txt;if(parent)parent.appendChild(e);return e;}
function set(e,o){for(const k in o)e.setAttribute(k,o[k]);}
const f3=v=>(+v).toFixed(3);
let seed=11;const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646;};

// ---------- closed Catmull-Rom spline -> cubic bezier path
function crPath(p,closed=true,ten=0.5){
  const n=p.length;let d=`M${p[0][0]},${p[0][1]}`;
  const g=i=>closed?p[(i+n)%n]:p[clamp(i,0,n-1)];
  const m=closed?n:n-1;
  for(let i=0;i<m;i++){
    const p0=g(i-1),p1=g(i),p2=g(i+1),p3=g(i+2);
    const c1=[p1[0]+(p2[0]-p0[0])*ten/3,p1[1]+(p2[1]-p0[1])*ten/3];
    const c2=[p2[0]-(p3[0]-p1[0])*ten/3,p2[1]-(p3[1]-p1[1])*ten/3];
    d+=`C${c1[0].toFixed(3)},${c1[1].toFixed(3)} ${c2[0].toFixed(3)},${c2[1].toFixed(3)} ${p2[0].toFixed(3)},${p2[1].toFixed(3)}`;
  }
  return d+(closed?'Z':'');
}

// ================= TEETH (world mm; incisal edge = y 0; up = -y; upper incisors, incisal edge at the bottom)
const CENTRAL=[[3.5,0.02],[3.98,-0.06],[4.3,-0.45],[4.42,-1.6],[4.38,-3.6],[4.2,-5.8],[3.9,-7.9],[3.6,-9.9],[3.44,-11.8],[3.4,-13.6],
  [0,-13.9],[-3.4,-13.6],[-3.46,-11.8],[-3.7,-9.9],[-4.08,-7.6],[-4.35,-5.2],[-4.35,-3.2],[-4.12,-1.6],[-3.62,-0.52],[-2.85,-0.08],[-1.2,0.06],[1.4,0.07]];
const LATERAL=[[2.55,0.0],[3.05,-0.32],[3.28,-1.4],[3.24,-3.5],[3.02,-5.8],[2.7,-7.9],[2.46,-9.8],[2.36,-12.5],[0,-12.9],[-2.36,-12.5],[-2.52,-9.8],[-2.94,-7.3],
  [-3.26,-4.8],[-3.22,-2.7],[-2.9,-1.15],[-2.25,-0.28],[-1.1,0.02],[1.0,0.04]];

function headD(){
  const rU=(-NU-BT)/2, rL=(NL-BT)/2;

    `M${XP},${-BT}`,
    `L${XN+rU},${-BT}`, `A${rU},${rU} 0 0 1 ${XN+rU},${NU}`,

}

    el('text',{x,y,'font-size':2.1,class:'eng','text-anchor':'middle',fill:'#232a33','fill-opacity':.9,'text-rendering':'geometricPrecision'},e,txt);

  const e40=eng('4.0',-6.4,2.95);

  const ring=el('rect',{x:-8.2,y:0.95,width:3.6,height:2.5,rx:.5,fill:'none',stroke:'#ff4f9d','stroke-width':.13,opacity:0},g);
  // pink contact edge (outer edge of the 4.0 prong)
  const edge=el('line',{x1:XP,y1:YL,x2:XH,y2:YL,stroke:'#ff4f9d','stroke-width':.2,'stroke-linecap':'round',opacity:0},g);
  return {g,sweep,veil,glow,e40,e45,ring,edge};

// ================= CAMERA
const CX=480, CY=480;
const CAM_A0={s:37.5,x:-4.45,y:-1.72}, CAM_A1={s:38.6,x:-4.45,y:-1.78};
const CAM_C0={s:50,x:-4.5,y:-5.0}, CAM_C1={s:51.2,x:-4.46,y:-4.98};
const CAM_W={s:30,x:0,y:-5.0};
let cam=CAM_A0;
const W2S=(x,y)=>[CX+(x-cam.x)*cam.s, CY+(y-cam.y)*cam.s];
const lerpCam=(a,b,k)=>({s:Math.exp(lerp(Math.log(a.s),Math.log(b.s),k)),x:lerp(a.x,b.x,k),y:lerp(a.y,b.y,k)});
function line(id,x1,y1,x2,y2){set(typeof id==='string'?$(id):id,{x1,y1,x2,y2});}

// ================= TIMELINE HELPERS
// bracket heights
function bracketY(i,t){
  if(i===1) return lerp(YB0[1],SLOT,eio(seg(t,3.95,4.55)));
  if(i===0) return lerp(YB0[0],SLOT,eio(seg(t,7.02,7.22)));
  if(i===2) return lerp(YB0[2],SLOT,eio(seg(t,8.24,8.44)));
  return lerp(YB0[3],SLOT,eio(seg(t,8.94,9.14)));
}
const CONTACT_W=[7.22,7.74,8.44,9.14];
// instrument state in world coords
function instState(t){
  const S=TEETH.map(T=>T.seat);
  if(t<2.7) return null;
  if(t<6.45){
    // set down beside the bracket (from the front), then slide the blade into the slot
    const kin=eio(seg(t,3.2,3.9)), kout=ei(seg(t,5.95,6.4));
    const lift=1-eio(seg(t,2.78,3.2));
    return {x:S[1]-2.6*(1-kin)-3.4*kout, y:bracketY(1,t), lift, op:eo(seg(t,2.72,2.98))*(1-seg(t,6.1,6.4)), seated:1};
  }
  // wide: glide in lifted, then hop tooth to tooth
  const legs=[ // [t0,t1,fromX,fromY,toIdx,downA,downB,upA,upB]
    [6.45,6.98,S[0]-10,YB0[0],0],
    [7.30,7.68,S[0],SLOT,1],
    [7.82,8.20,S[1],SLOT,2],
    [8.52,8.90,S[2],SLOT,3]];
  let x=S[0]-10,y=YB0[0],lift=1;
  for(let i=0;i<legs.length;i++){
    const [a,b,fx,fy,to]=legs[i];
    if(t>=a){
      const k=eio(seg(t,i===0?a:a+0.06,b));
      x=lerp(fx,S[to],k); y=lerp(fy,(to===1?SLOT:YB0[to]),k);
      const up=(i===0)?1:seg(t,a,a+0.1);
      const down=seg(t,b-0.08,b+0.04);
      lift=Math.max(0,Math.min(up,1-down));
      if(t>=b+0.04){ y=bracketY(to,t); lift=0; }
    }
  }
  let op=eo(seg(t,6.45,6.65));
  if(t>=9.22){
    const k=eo(seg(t,9.25,9.6));
    x=S[3]-1.4*k; y=SLOT-0.7*k; lift=seg(t,9.22,9.34); op*=1-seg(t,9.28,9.55);
  }
  return {x,y,lift,op,seated:0};
}

// ================= RENDER
window.render=function(t){
  // header + card
  const hin=eo(seg(t,0,0.3));
  $('hdr').style.opacity=hin.toFixed(3); $('hdr').style.transform=`translateY(${((1-hin)*16).toFixed(2)}px)`;
  const cin=eo(seg(t,0.02,0.3));
  $('card').style.opacity=cin.toFixed(3); $('card').style.transform=`translateY(${((1-cin)*28).toFixed(2)}px)`;

  // camera
  if(t<2.3) cam=lerpCam(CAM_A0,CAM_A1,seg(t,0,2.3));
  else if(t<3.1) cam=lerpCam(CAM_A1,CAM_C0,eio(seg(t,2.3,3.1)));
  else if(t<6.05) cam=lerpCam(CAM_C0,CAM_C1,seg(t,3.1,6.05));
  else cam=lerpCam(CAM_C1,CAM_W,eio(seg(t,6.05,6.9)));
  const WT=`translate(${f3(CX)},${f3(CY)}) scale(${f3(cam.s)}) translate(${f3(-cam.x)},${f3(-cam.y)})`;
  ['worldA','worldB','worldG'].forEach(id=>$(id).setAttribute('transform',WT));

  // brackets
  const by=TEETH.map((T,i)=>bracketY(i,t));
  brNodes.forEach((n,i)=>{ n.g.setAttribute('transform',`translate(${TEETH[i].x},${f3(by[i])})`); set(n.ins,{width:0}); set(n.insPad,{width:0}); set(n.insF,{width:0}); });
  set($('bladeOutP'),{d:'M-90,-30 H40 V30 H-90Z'}); set($('bladeInR'),{x:100,y:100,width:1,height:1});

  // instrument
  const st=instState(t);
  if(st && st.op>0.001){
    const k=cam.s*(1+(t<6.45?0.05:0.035)*st.lift);
    const [px,py]=W2S(st.x,st.y);
    const tr=`translate(${f3(px)},${f3(py)}) scale(${f3(k)})`;
    const wf=t>6.3?1:0;
    instFade.setAttribute('transform',tr);
    set($('barFadeG'),{x1:wf?-13.2:-80,x2:wf?-10.9:-79});
    instG.setAttribute('opacity',f3(st.op));
    bladeInG.setAttribute('opacity',0);
    set($('instShF'),{dx:f3(0.12+0.3*st.lift),dy:f3(0.22+0.7*st.lift),stdDeviation:f3(0.18+0.42*st.lift),'flood-opacity':f3(0.34-0.08*st.lift)});
    // blade lying in the slot of the bracket it is engaged with
    if(st.lift<0.999){
      TEETH.forEach((T,i)=>{
        if(Math.abs(st.y-by[i])<0.15 && st.x>T.padL && st.x<=T.seat+0.01){
          const n=brNodes[i];
          // blade disappears into this bracket's slot: clip it out of the instrument, draw it inside the bracket
          const x0=T.padL-st.x-0.01, x1=T.x+(T.hw+PAD)*T.sx-st.x+0.02, y0=by[i]-1.98-st.y, y1=by[i]+1.98-st.y;
          set($('bladeOutP'),{d:`M-90,-30 H40 V30 H-90Z M${f3(x0)},${f3(y0)} H${f3(x1)} V${f3(y1)} H${f3(x0)}Z`});
          set($('bladeInR'),{x:f3(x0),y:f3(y0),width:f3(x1-x0),height:f3(y1-y0)});
          bladeInG.setAttribute('opacity',f3(st.lift));
          [n.ins,n.insPad,n.insF].forEach(e=>e.setAttribute('opacity',f3(1-st.lift)));
          const padW=Math.min(st.x,T.x-T.hw*T.sx)-T.padL;
          set(n.insPad,{width:f3(Math.max(0,padW)/T.sx)});
          const slotW=Math.max(0,st.x-(T.x-T.hw*T.sx));
          set(n.ins,{width:f3(slotW/T.sx)}); set(n.insF,{width:f3(slotW/T.sx)});
        }
      });
    }
  } else { instG.setAttribute('opacity',0); }

  // instrument details: sweep, 4.5 dimmer, 4.0 glow
  {
    const ks=seg(t,3.0,4.0);
    set(HS.sweep,{x:f3(lerp(-14,1,eio(ks))-3),opacity:(ks>0&&ks<1)?1:0});
    const dimK=eo(seg(t,3.95,4.4));
    HS.veil.setAttribute('opacity',f3(0.32*dimK));
    HS.e45.setAttribute('opacity',f3(1-0.5*dimK));
    // pink on the 4.0 engraving + 4.0 prong edge at the moment of contact (close-up) and at each wide contact
    let g=seg(t,4.5,4.62)*(1-0.35*seg(t,4.9,5.3));
    let ed=seg(t,4.5,4.6);
    if(t>=6.45){ g=0; ed=0;
      CONTACT_W.forEach(c=>{ const p=seg(t,c-0.04,c+0.06)*(1-seg(t,c+0.18,c+0.36)); g=Math.max(g,p*0.85); ed=Math.max(ed,p); }); }
    HS.glow.setAttribute('opacity',f3(g)); HS.ring.setAttribute('opacity',f3(g));
    HS.edge.setAttribute('opacity',f3(ed));
  }

  // neighbour veil (lighter)
  {
    const [wx,wy]=W2S(TEETH[FOCUS].x,-5.0);
    const rx=4.45*1.1*cam.s/0.64, ry=8.6*cam.s/0.64;
    $('wmg').setAttribute('gradientTransform',`translate(${f3(wx)},${f3(wy)}) scale(${f3(rx)},${f3(ry)})`);
    $('wash').setAttribute('opacity',f3(0.46*eo(seg(t,0.1,0.6))*(1-eio(seg(t,6.05,6.7)))));
  }

  // inset (beat 1): DE LA LÁMINA AL HOMBRO = ALTURA
  {
    const pin=eo(seg(t,0.36,0.8)), pout=seg(t,2.2,2.5);
    $('inset').setAttribute('opacity',f3(pin*(1-pout)));
    $('inset').setAttribute('transform',`translate(0 ${f3((1-pin)*22+eio(pout)*14)})`);
    const a1=eo(seg(t,0.75,1.05)), a2=eo(seg(t,0.95,1.3)), a3=eo(seg(t,1.2,1.55));
    iCL.setAttribute('opacity',f3(a1)); iTL.setAttribute('opacity',f3(a1)); iMid.setAttribute('opacity',f3(a2));
    iEU.setAttribute('opacity',f3(a2)); iEL.setAttribute('opacity',f3(a2));
    iDU.setAttribute('opacity',f3(a2)); iDL.setAttribute('opacity',f3(a2));
    iL45.setAttribute('opacity',f3(a3)); iL40.setAttribute('opacity',f3(a3));
    iL40.setAttribute('transform',`translate(${f3((1-a3)*-10)} 0)`);
    iTH.setAttribute('opacity',f3(a3));
  }

  // view label
  {
    const wide=t>=6.5;
    $('viewLblT').textContent= wide?'VISTA LABIAL · SECTOR ANTERIOR':'VISTA LABIAL · INCISIVO CENTRAL';
    const o= wide? eo(seg(t,6.9,7.3)) : eo(seg(t,0.35,0.7))*(1-seg(t,2.2,2.45));
    $('viewLbl').setAttribute('opacity',f3(o));
    const w=$('viewLblT').getComputedTextLength();
    $('viewLblR').setAttribute('width',f3(w+48));
  }

  // tooth long axis
  {
    const ax=W2S(TEETH[FOCUS].x,0)[0];
    const [,yTop]=W2S(0,-11.75), [,yBot]=W2S(0,1.1);
    const k=eio(seg(t,4.75,5.2));
    const yk=lerp(yBot,yTop,k);
    line('axL',ax,yBot,ax,yk);
    const [,yM]=W2S(0,-10.4);
    line('axL2',ax,yM,ax,Math.min(yM,yk));
    $('axL2').setAttribute('opacity',yk<yM?1:0);
    const [,py]=W2S(0,-12.25);
    const tw=$('axT').getComputedTextLength();
    set($('axPR'),{x:f3(ax-tw/2-22),y:f3(py-23),width:f3(tw+44)});
    set($('axT'),{x:f3(ax),y:f3(py+1)});
    $('axP').setAttribute('opacity',f3(eo(seg(t,5.0,5.3))));
    const axo=f3(seg(t,4.75,4.85)*(1-seg(t,5.95,6.25))); $('axis').setAttribute('opacity',axo); $('axisCrown').setAttribute('opacity',axo);
  }

  // slot highlight while the blade enters
  {
    const T=TEETH[FOCUS];
    const [sx,sy]=W2S(T.x,by[1]);
    const bw=(2*T.hw+0.1)*cam.s, sh=0.56*cam.s;
    set($('slotHiR'),{x:f3(sx-bw/2-8),y:f3(sy-sh/2-7),width:f3(bw+16),height:f3(sh+14)});
    set($('slotHiG'),{x:f3(sx-bw/2-70),y:f3(sy-64),width:f3(bw+140),height:128});
    $('slotHi').setAttribute('opacity',f3(seg(t,3.45,3.65)*(1-seg(t,4.0,4.35))));
  }

  // contact (close-up): outer edge of the 4.0 prong flush with the incisal edge
  {
    const T=TEETH[FOCUS];
    const [cx_,cy_]=W2S(T.prong,0);
    const [lx0]=W2S(T.prong-2.6,0), [lx1]=W2S(T.prong+1.5,0);
    const k=seg(t,4.52,5.25);
    line('ctLine',lx0,cy_,lx1,cy_);
    set($('ctRing'),{cx:f3(cx_),cy:f3(cy_),r:f3(12+38*eo(k)),opacity:f3(1-k)});
    set($('ctGlow'),{cx:f3(cx_),cy:f3(cy_),rx:f3(4.2*cam.s),ry:f3(0.9*cam.s)});
    set($('ctDot'),{cx:f3(cx_),cy:f3(cy_)});
    $('contact').setAttribute('opacity',f3(seg(t,4.5,4.62)*(1-seg(t,5.95,6.25))));
  }

  // dimension: incisal edge -> slot centre (4.0 mm), parallel to the long axis
  {
    const T=TEETH[FOCUS];
    const dxw=T.x+T.hw+PAD+1.15;
    const [px,y0]=W2S(dxw,0), [,y1]=W2S(dxw,SLOT);
    const [e1x]=W2S(T.x+0.6,0), [e2x]=W2S(T.x+T.hw+PAD+0.1,0);
    const ke=eo(seg(t,4.85,5.2));
    line('ext1',e1x,y0,lerp(e1x,px+18,ke),y0);
    line('ext2',e2x,y1,lerp(e2x,px+18,ke),y1);
    const kd=eio(seg(t,5.05,5.5));
    line('dline',px,y0-6,px,lerp(y0-6,y1+6,kd));
    $('dline').setAttribute('opacity',kd>0?1:0);
    const kt=seg(t,5.05,5.15), kt2=seg(t,5.45,5.55);
    line('tick1',px-13,y0,px+13,y0); $('tick1').setAttribute('opacity',f3(kt));
    line('tick2',px-13,y1,px+13,y1); $('tick2').setAttribute('opacity',f3(kt2));
    $('arr1').setAttribute('d',`M${f3(px)},${f3(y0-1.5)} l-8.5,-16 l17,0z`); $('arr1').setAttribute('opacity',f3(kt));
    $('arr2').setAttribute('d',`M${f3(px)},${f3(y1+1.5)} l-8.5,16 l17,0z`); $('arr2').setAttribute('opacity',f3(kt2));
    const kl=eo(seg(t,5.35,5.75));
    $('dlab').setAttribute('transform',`translate(${f3(px+26-(1-kl)*14)},${f3(y1+22)})`);
    $('dlab').setAttribute('opacity',f3(kl));
    const kp=eo(seg(t,5.5,5.8));
    set($('dp1'),{x:f3(px+34),y:f3(y1+22+76+38)}); set($('dp2'),{x:f3(px+34),y:f3(y1+22+76+70)});
    $('dpar').setAttribute('opacity',f3(kp));
    $('dim').setAttribute('opacity',f3(seg(t,4.85,4.9)*(1-seg(t,5.98,6.3))));
  }

  // wide view: one level line through the slots, 4.0 mm chips, legend
  {
    $('align').setAttribute('opacity',f3(seg(t,6.75,6.95))); $('alignU').setAttribute('opacity',f3(seg(t,6.75,6.95)));
    const [lx0,ys]=W2S(-15.8,SLOT), [lx1]=W2S(15.8,SLOT), [,yi]=W2S(0,0);
    const ki=eio(seg(t,6.8,7.5));
    line('incLine',lx0,yi,lerp(lx0,lx1,ki),yi);
    // slot line grows bracket by bracket
    let xr=-15.8;
    const ends=TEETH.map(T=>T.x+(T.hw+PAD)*T.sx+0.4);
    CONTACT_W.forEach((c,i)=>{ const k=eo(seg(t,c,c+0.32)); if(k>0) xr=lerp(i===0?-15.8:ends[i-1],ends[i],k); });
    xr=lerp(xr,15.8,eo(seg(t,9.2,9.55)));
    const [sxr]=W2S(xr,SLOT);
    line('slotLine',lx0,ys,sxr,ys);
    $('slotLine').setAttribute('opacity',t>=CONTACT_W[0]?1:0);
    TEETH.forEach((T,i)=>{
      const c=CONTACT_W[i];
      const n=chipNodes[i];
      const [tx,ty]=W2S(T.x,1.95);
      const kc=eo(seg(t,c,c+0.32));
      n.g.setAttribute('transform',`translate(${f3(tx)},${f3(ty+(1-kc)*10)})`);
      n.g.setAttribute('opacity',f3(kc));
      const [bx,byy]=W2S(T.x,by[i]);
      const bw=(2*T.hw+0.1)*T.sx*cam.s, sh=0.56*cam.s;
      const kp=seg(t,c-0.02,c+0.6);
      set(n.p,{x:f3(bx-bw/2-6-kp*7),y:f3(byy-sh/2-5-kp*7),width:f3(bw+12+kp*14),height:f3(sh+10+kp*14),opacity:f3(kp>0?(1-kp)*0.95:0)});
      // contact flash at the incisal edge
      const [cx_,cy_]=W2S(T.prong,0), [l0]=W2S(T.prong-1.6,0), [l1]=W2S(T.prong+1.0,0);
      const kk=seg(t,c-0.02,c+0.5);
      line(n.cl,l0,cy_,l1,cy_);
      set(n.cr,{cx:f3(cx_),cy:f3(cy_),r:f3(8+24*eo(kk)),opacity:f3(1-kk)});
      set(n.cd,{cx:f3(cx_),cy:f3(cy_)});
      n.cg.setAttribute('opacity',f3(kk>0&&kk<1? Math.min(1,kk*8)*(1-seg(t,c+0.25,c+0.5)) : 0));
    });
    $('legend').setAttribute('opacity',f3(eo(seg(t,9.3,9.65))));
    $('legend').setAttribute('transform',`translate(0 ${f3((1-eo(seg(t,9.3,9.65)))*10)})`);
  }

  // captions (sequential, no overlap)
  const caps=[['c1',0.12,2.62],['c2',2.72,3.88],['c3',3.92,4.78],['c4',4.82,6.22],['c5',6.36,99]];
  caps.forEach(([id,a,b])=>{
    const kin=eo(seg(t,a,a+0.32)), kout=seg(t,b-0.16,b);
    const e=$(id); e.style.opacity=(kin*(1-kout)).toFixed(3);
    e.style.transform=`translateY(${((1-kin)*16-kout*10).toFixed(2)}px)`;
  });
};
render(0);
document.fonts.ready.then(()=>{window.__ready=true;render(window.__t||0);});
})();
</script>
</body></html>
